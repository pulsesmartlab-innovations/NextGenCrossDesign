# ShinyProxy configuration for the NextGenCrossDesign workbench.
# Drop this into your ShinyProxy server's application.yml (merge the `proxy`
# block into your existing one). ShinyProxy starts ONE container per user
# session by default, which is the isolation model the workbench is built for.
#
# Reference: https://shinyproxy.io/documentation/configuration/
# Key names can shift between ShinyProxy major versions — validate against the
# version you run.

proxy:
  title: NextGenCrossDesign
  port: 8080                      # port ShinyProxy itself listens on
  container-backend: docker

  docker:
    # Path/URL to the Docker daemon ShinyProxy launches containers on.
    url: unix:///var/run/docker.sock
    # The version tag is immutable, so pulling only when absent is safe. Use
    # Always if you ever re-push the same tag (e.g. :latest).
    image-pull-policy: IfNotPresent
    # Give each user container its own internal network.
    internal-networking: true
    # The image is a GitHub Container Registry package. The Docker daemon that
    # runs the containers must be able to pull it:
    #   - public package  -> no auth needed, pulls directly.
    #   - private package -> log the host daemon in once with a read:packages PAT:
    #       echo <PAT-with-read:packages> | docker login ghcr.io -u <user> --password-stdin
    # Visibility: Packages -> ngcd-workbench -> Package settings -> Change visibility.

  # --- Authentication (choose one; 'none' shown for a private/internal pilot) --
  # For a public "scientists worldwide" deployment, use ldap / openid / saml /
  # keycloak instead and gate access with access-groups on the spec below.
  authentication: none

  specs:
    - id: ngcd
      display-name: NextGenCrossDesign — cross prediction & mate allocation
      description: Genomic cross prediction and mate allocation workbench.
      # Fully-qualified multi-arch image on ghcr (linux/amd64 + linux/arm64).
      # The daemon pulls the arch matching the host automatically.
      container-image: ghcr.io/pulsesmartlab-innovations/ngcd-workbench:0.15.2
      # The app listens on 3838 inside the container (see Dockerfile EXPOSE/CMD).
      port: 3838
      # Per-deployment tuning without rebuilding the image: override any NGCD_*
      # key. Left mostly to the image defaults here.
      container-env:
        NGCD_KEEP_RUNS: "20"
        # NGCD_DATA_DIR: "/tmp/ngcd"   # only if you mount persistent storage
      # Reclaim resources from idle sessions.
      container-memory-limit: 4g
      # access-groups: [breeders]     # enable with a real authentication backend
