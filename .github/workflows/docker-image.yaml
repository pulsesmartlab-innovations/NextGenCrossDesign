# Builds the ShinyProxy deployment image (deploy/Dockerfile) and smoke-tests it,
# so a broken Dockerfile is caught by CI rather than only by manual local runs.
# The other workflow (R-CMD-check) exercises the R package but NOT the Docker
# build, which is where recent breakage lived (e.g. an invalid R CMD INSTALL
# flag, a vignette that failed to render into the image).
#
# Runs only when the deployment assets or this workflow change — a full image
# build (apt + CRAN + backend C++ kernel + frontend + vignette render) is
# minutes-expensive, and the package itself is already gated by R-CMD-check.
#
# PUBLISHING. Until now this workflow built the image, smoke-tested it and then
# threw it away, so the only route to the registry was someone running
# `docker push` by hand — which is why the published image sat at frontend
# 0.25.1 / backend ~0.17 while main moved on to 0.26.0 / 0.20.0. The publish job
# below closes that gap: it pushes to GHCR using the built-in GITHUB_TOKEN, so no
# personal registry login and no local Docker are involved.
#
# Publishing is deliberate, never incidental: it happens ONLY on a manual
# workflow_dispatch with publish = true. Pushes to main and pull requests build
# and smoke-test exactly as before and never touch the registry. The push is also
# gated behind the smoke test, so a container that does not serve HTTP 200 cannot
# reach the registry.
name: docker-image

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/docker-image.yaml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/docker-image.yaml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the smoke-tested image to GHCR'
        type: boolean
        default: true
      platforms:
        description: 'Platforms to publish (arm64 builds under QEMU and is slow)'
        type: string
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read
  packages: write

# One publish at a time, so two dispatches cannot race for the same tags.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: build & smoke-test deployment image
    timeout-minutes: 300
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ngcd-workbench
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # The image bundles BOTH packages (the frontend drives the backend as a
      # subprocess). The backend lives in a separate, public repo; check it out
      # so we can build its source tarball for the image's BACKEND_TARBALL arg.
      # No ref is pinned, so this tracks the backend's default branch.
      - name: Checkout backend (nextgenCrossDesignR)
        uses: actions/checkout@v4
        with:
          repository: pulsesmartlab-innovations/nextgenCrossDesignR
          path: backend-src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Source tarballs only — vignettes are rendered INSIDE the image
      # (deploy/Dockerfile has pandoc + knitr), so no host pandoc / deps are
      # needed here, and R CMD build --no-build-vignettes just packages source.
      - name: Build source tarballs
        run: |
          set -euo pipefail
          R CMD build backend-src --no-build-vignettes --no-manual
          R CMD build .           --no-build-vignettes --no-manual
          BE_TARBALL=$(ls nextgenCrossDesign_*.tar.gz | head -1)
          FE_TARBALL=$(ls nextgenCrossWorkbench_*.tar.gz | head -1)
          echo "BE_TARBALL=$BE_TARBALL" >> "$GITHUB_ENV"
          echo "FE_TARBALL=$FE_TARBALL" >> "$GITHUB_ENV"
          # Versions are derived from the tarball names, so the image tag can never
          # disagree with what is actually inside it.
          BE_VERSION=$(echo "$BE_TARBALL" | sed -E 's/^nextgenCrossDesign_(.+)\.tar\.gz$/\1/')
          FE_VERSION=$(echo "$FE_TARBALL" | sed -E 's/^nextgenCrossWorkbench_(.+)\.tar\.gz$/\1/')
          echo "BE_VERSION=$BE_VERSION" >> "$GITHUB_ENV"
          echo "FE_VERSION=$FE_VERSION" >> "$GITHUB_ENV"
          echo "built backend=$BE_TARBALL frontend=$FE_TARBALL"
          echo "versions: backend=$BE_VERSION frontend=$FE_VERSION"

      # Single-arch (native amd64, no emulation) build loaded into the local
      # docker so the smoke test can run it. This is the step that fails on a
      # broken Dockerfile — the whole point of this workflow.
      - name: Build deployment image
        run: |
          set -euo pipefail
          docker build \
            -f deploy/Dockerfile \
            --build-arg BACKEND_TARBALL="$BE_TARBALL" \
            --build-arg FRONTEND_TARBALL="$FE_TARBALL" \
            -t ngcd-workbench:ci \
            --load .

      - name: Smoke-test (vignette bundled + app serves HTTP 200)
        run: |
          set -euo pipefail
          # 1. the rendered user-guide vignette must be present in the container
          docker run --rm --entrypoint Rscript ngcd-workbench:ci -e '
            v <- vignette(package = "nextgenCrossWorkbench")
            if (nrow(v$results) < 1L) stop("no vignette bundled in the image")
            h <- system.file("doc", "nextgenCrossWorkbench.html", package = "nextgenCrossWorkbench")
            if (!nzchar(h) || !file.exists(h)) stop("rendered vignette HTML missing from inst/doc")
            cat("vignette OK: ", paste(v$results[, "Item"], collapse = ", "), "\n", sep = "")'
          # 2. the app itself must come up and serve HTTP 200
          cid=$(docker run -d -p 3838:3838 ngcd-workbench:ci)
          ok=""
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3838/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          echo "--- container logs (tail) ---"; docker logs "$cid" 2>&1 | tail -20 || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then echo "app did not serve HTTP 200"; exit 1; fi
          echo "HTTP 200 OK"

      # ---- publish (manual dispatch only, and only after the smoke test) -------

      # Report what is about to be published BEFORE pushing, so a dispatch that
      # would ship an unexpected backend is visible in the log rather than only
      # discoverable afterwards by inspecting the image.
      - name: Publish plan
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          echo "image     : $IMAGE"
          echo "tags      : ${FE_VERSION}, latest"
          echo "frontend  : ${FE_VERSION}"
          echo "backend   : ${BE_VERSION}  (bundled; the frontend's minimum is inst/BACKEND_VERSION)"
          echo "platforms : ${{ inputs.platforms }}"

      # arm64 is emulated via QEMU; it is correct but slow for an image that
      # compiles the backend's C++ kernel. Drop it from `platforms` for a fast
      # amd64-only publish.
      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch images cannot be --load-ed, so this rebuilds under buildx and
      # pushes directly. The smoke test above has already gated it on the native
      # arch. Both bundled versions are recorded as labels, so `docker inspect`
      # answers "what backend is actually in this image?" without guesswork --
      # the question that let the published image drift several versions behind.
      - name: Build and push to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          build-args: |
            BACKEND_TARBALL=${{ env.BE_TARBALL }}
            FRONTEND_TARBALL=${{ env.FE_TARBALL }}
          tags: |
            ${{ env.IMAGE }}:${{ env.FE_VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=NextGenCrossDesign workbench
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FE_VERSION }}
            io.ngcd.frontend.version=${{ env.FE_VERSION }}
            io.ngcd.backend.version=${{ env.BE_VERSION }}

      - name: Published
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          echo "pushed ${IMAGE}:${FE_VERSION} and ${IMAGE}:latest"
          echo "bundled backend ${BE_VERSION} / frontend ${FE_VERSION}"
          echo "verify with: docker inspect ${IMAGE}:${FE_VERSION} --format '{{json .Config.Labels}}'"
